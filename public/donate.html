<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZetDonate — Donasi</title><style>
:root{--bg:#07070b;--line:#2a2a36;--muted:#9696a7;--brand:#8b5cf6;--pink:#ec4899}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#382052,#0a0910 52%,#07070b)}.wrap{width:min(650px,92%);margin:auto;padding:45px 0 60px}.brand{display:flex;justify-content:center;align-items:center;gap:9px;font-weight:950;font-size:20px;margin-bottom:30px}.mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--pink))}.card{background:linear-gradient(180deg,#15151e,#101017);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 25px 90px #0007}.ava{width:78px;height:78px;margin:0 auto 17px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#ec4899);font-size:27px;font-weight:950}.center{text-align:center}.sub{color:var(--muted);line-height:1.6;margin-top:-6px}label{display:block;font-size:12px;color:#bcbcca;margin:17px 0 7px}input,textarea,select{width:100%;padding:13px 14px;background:#09090f;color:#fff;border:1px solid var(--line);border-radius:12px;outline:0}input:focus,textarea:focus,select:focus{border-color:var(--brand)}textarea{min-height:90px;resize:vertical}.btn{width:100%;padding:14px;margin-top:20px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--brand),#7c3aed);color:#fff;font-weight:900;cursor:pointer}.hint{font-size:11px;color:#737383;margin-top:7px}.pay{margin-top:20px;background:#09090f;border:1px dashed #41414d;border-radius:16px;padding:20px;text-align:center}.qr{max-width:280px;width:100%;border-radius:10px}.pay a{color:#c4b5fd}.secure{margin-top:18px;text-align:center;font-size:11px;color:#686878}
</style></head><body><div class="wrap"><div class="brand"><div class="mark">Z</div>ZetDonate</div><div class="card"><div class="ava" id="avatar">Z</div><h1 class="center" id="title">Dukung Streamer</h1><p class="center sub">Kirim dukungan, pesan, dan Media Share untuk streamer favoritmu.</p><form id="f"><label>Nama</label><input id="n" required maxlength="60" placeholder="Nama kamu"><label>Nominal Donasi</label><input id="a" type="number" min="1000" step="1000" required placeholder="Contoh: 50000"><label>Pesan</label><textarea id="m" maxlength="250" placeholder="Tulis pesan untuk streamer..."></textarea><label>Media Share URL <span class="hint">(opsional)</span></label><input id="u" placeholder="https://youtube.com/watch?v=..."><label>Metode Pembayaran</label><select id="c"></select><button class="btn">Lanjut ke Pembayaran</button></form><div id="p" class="pay" style="display:none"></div><div class="secure">🔒 Pembayaran diproses secara aman melalui payment gateway.</div></div></div><script>
const slug=location.pathname.split("/").pop();let streamerId;const c=document.querySelector("#c");(async()=>{const s=await(await fetch("/api/public/streamer/"+encodeURIComponent(slug))).json();if(!s.success){title.textContent="Streamer tidak ditemukan";return}streamerId=s.streamer.id;title.textContent="Dukung "+s.streamer.displayName;avatar.textContent=(s.streamer.displayName||"Z").trim().charAt(0).toUpperCase();const j=await(await fetch("/api/channels")).json();c.innerHTML=j.channels.map(x=>`<option value="${x.code}">${x.name}</option>`).join("")})();f.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/donations",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({streamerId,donorName:n.value,amount:Number(a.value),message:m.value,mediaUrl:u.value,channel:c.value})});const j=await r.json();if(!r.ok)return alert(j.message);const x=j.donation.payment||{};p.style.display="block";p.innerHTML=x.qrImage?`<b>Scan QR untuk membayar</b><br><img class=qr src="${x.qrImage}"><p class=hint>Selesaikan pembayaran sebelum masa berlaku berakhir.</p>`:x.vaNumber?`<b>Virtual Account</b><h2>${x.vaNumber}</h2><p class=hint>Salin nomor VA lalu lakukan pembayaran melalui mobile banking.</p>`:x.paymentUrl?`<b>Pembayaran siap</b><br><a class=btn style="display:block;text-decoration:none" href="${x.paymentUrl}" target="_blank">BUKA HALAMAN PEMBAYARAN</a>`:`Order <b>${j.donation.id}</b><br>Status: ${j.donation.status}`};
</script></body></html>
