<!doctype html><html lang=id><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Donasi</title><style>body{margin:0;background:radial-gradient(circle at top,#2a1e40,#08090d 48%);color:#fff;font-family:system-ui}.wrap{width:min(620px,92%);margin:55px auto}.card{background:#12151c;border:1px solid #292d39;border-radius:20px;padding:25px}.ava{width:75px;height:75px;margin:auto;border-radius:50%;background:#8b5cf6;display:grid;place-items:center;font-size:30px}.center{text-align:center}label{display:block;font-size:13px;margin:15px 0 7px}input,textarea,select{width:100%;box-sizing:border-box;padding:13px;background:#090b10;color:#fff;border:1px solid #333;border-radius:10px}textarea{min-height:80px}.btn{width:100%;padding:14px;margin-top:18px;border:0;border-radius:10px;background:#8b5cf6;color:#fff;font-weight:900}.pay{margin-top:20px;background:#090b10;border:1px dashed #444;border-radius:13px;padding:18px;text-align:center}.qr{max-width:270px;width:100%}</style></head><body><div class=wrap><div class=card><div class=ava>❤️</div><h1 class=center id=title>Donasi</h1><p class=center>Kirim donasi, pesan, dan Media Share.</p><form id=f><label>Nama</label><input id=n required><label>Nominal</label><input id=a type=number min=1000 step=1000 required><label>Pesan</label><textarea id=m maxlength=250></textarea><label>Media Share URL (opsional)</label><input id=u placeholder="YouTube URL"><label>Metode Pembayaran</label><select id=c></select><button class=btn>Bayar Sekarang</button></form><div id=p class=pay style="display:none"></div></div></div><script>const slug=location.pathname.split("/").pop();let streamerId;const c=document.querySelector("#c");(async()=>{const s=await(await fetch("/api/public/streamer/"+slug)).json();if(!s.success)return title.textContent="Streamer tidak ditemukan";streamerId=s.streamer.id;title.textContent="Dukung "+s.streamer.displayName;const j=await(await fetch("/api/channels")).json();c.innerHTML=j.channels.map(x=>`<option value="${x.code}">${x.name}</option>`).join("")})();f.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/donations",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({streamerId,donorName:n.value,amount:Number(a.value),message:m.value,mediaUrl:u.value,channel:c.value})});const j=await r.json();if(!r.ok)return alert(j.message);const x=j.donation.payment||{};p.style.display="block";p.innerHTML=x.qrImage?`<img class=qr src="${x.qrImage}">`:x.vaNumber?`<b>Virtual Account</b><h2>${x.vaNumber}</h2>`:x.paymentUrl?`<a class=btn href="${x.paymentUrl}" target=_blank>BUKA PEMBAYARAN</a>`:`Order ${j.donation.id} dibuat. Status ${j.donation.status}`}</script></body></html>
