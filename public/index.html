<!doctype html><html lang=id><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Donasi.Live</title><style>body{margin:0;background:#08090d;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(430px,90%);background:#12151c;border:1px solid #292d39;border-radius:20px;padding:28px}h1 b{color:#a78bfa}input,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:10px}input{background:#090b10;border:1px solid #333;color:#fff}button{border:0;background:#8b5cf6;color:#fff;font-weight:800;cursor:pointer}.muted{color:#9ba1b0;font-size:13px}a{color:#a78bfa}</style></head><body><div class=box><h1>DONASI<b>.LIVE</b></h1><p class=muted>Platform donasi untuk streamer.</p><div id=a></div></div><script>const a=document.querySelector("#a");function login(){a.innerHTML='<h2>Login</h2><input id=e placeholder="Email"><input id=p type=password placeholder="Password"><button onclick="goL()">Masuk</button><p class=muted>Belum punya akun? <a href=# onclick=reg()>Daftar</a></p>'}function reg(){a.innerHTML='<h2>Daftar Streamer</h2><input id=n placeholder="Nama streamer"><input id=e placeholder="Email"><input id=p type=password placeholder="Password minimal 8 karakter"><button onclick="goR()">Buat Akun</button><p class=muted>Sudah punya akun? <a href=# onclick=login()>Login</a></p>'}async function goL(){const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e.value,password:p.value})}),j=await r.json();if(!r.ok)return alert(j.message);localStorage.token=j.token;location="/dashboard.html"}async function goR(){const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e.value,password:p.value,displayName:n.value})}),j=await r.json();if(!r.ok)return alert(j.message);localStorage.token=j.token;location="/dashboard.html"}login()</script></body></html>
