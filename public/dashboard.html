<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZetDonate — Dashboard</title><style>
:root{--bg:#08080d;--panel:#111118;--line:#282833;--text:#f7f7fb;--muted:#9292a3;--brand:#8b5cf6;--pink:#ec4899}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#24183b,#08080d 48%);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1160px,92%);margin:auto;padding-bottom:60px}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:10px;font-weight:950;font-size:21px}.logo b{color:#c4b5fd}.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--pink))}.btn{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:800}.primary{background:var(--brand);color:#fff}.ghost{background:#ffffff08;color:#fff;border:1px solid var(--line)}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:28px 0}.hero h1{font-size:34px;margin:0 0 7px;letter-spacing:-1px}.muted{color:var(--muted)}.small{font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:linear-gradient(180deg,#14141d,#101017);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 60px #0003}.stat-label{font-size:13px;color:var(--muted)}.num{display:block;font-size:29px;font-weight:950;margin-top:8px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}.card h2{font-size:17px;margin:0 0 15px}.row{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.row:last-child{border-bottom:0}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#ffffff09;color:#bdbdcc;font-size:11px}.linkbox{background:#09090e;border:1px dashed #383844;border-radius:12px;padding:13px;word-break:break-all;font-size:13px;color:#c4b5fd}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:18px 0;color:var(--muted);font-size:13px}.danger{background:#ef44441a;color:#fca5a5}.media-url{max-width:430px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><nav class="nav"><div class="logo"><div class="mark">Z</div>Zet<b>Donate</b></div><button class="btn ghost" onclick="logout()">Keluar</button></nav><section class="hero"><div><div class="small muted">CREATOR DASHBOARD</div><h1 id="greet">Dashboard</h1><div id="profile" class="muted"></div></div><a id="donateLink" class="btn primary" target="_blank">Buka Halaman Donasi</a></section><div class="stats"><div class="card"><span class="stat-label">Donasi Berhasil</span><span class="num" id="c">0</span></div><div class="card"><span class="stat-label">Total Pendapatan</span><span class="num" id="t">Rp0</span></div><div class="card"><span class="stat-label">Media Queue</span><span class="num" id="mq">0</span></div></div><div class="grid"><section class="card"><h2>Integrasi YouTube</h2><div id="yt" class="muted">Belum terhubung</div><br><a class="btn primary" href="/api/integrations/youtube/start">Hubungkan YouTube</a></section><section class="card"><h2>OBS Browser Source</h2><div class="small muted" style="margin-bottom:9px">Masukkan URL ini ke OBS → Sources → Browser.</div><div class="linkbox" id="ov"></div><br><button class="btn ghost" onclick="copyText(ov.textContent)">Salin URL</button></section><section class="card"><h2>Donasi Terbaru</h2><div id="d"></div></section><section class="card"><h2>Media Share</h2><div id="q"></div></section></div></div><script>
const H={Authorization:"Bearer "+localStorage.token};if(!localStorage.token)location="/";const f=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);const esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));async function load(){const r=await fetch("/api/dashboard",{headers:H});if(!r.ok)return logout();const j=await r.json(),me=await(await fetch("/api/me",{headers:H})).json();greet.textContent="Halo, "+me.user.displayName+" 👋";profile.textContent="Kelola donasi dan alert stream kamu dari satu tempat.";donateLink.href=location.origin+"/donate/"+me.user.slug;c.textContent=j.stats.count;t.textContent=f(j.stats.total);mq.textContent=j.stats.media;ov.textContent=location.origin+"/overlay/"+me.user.id;yt.innerHTML=me.user.youtube?`Terhubung: <b>${esc(me.user.youtube.channel?.title||"YouTube")}</b>`:"Belum terhubung";d.innerHTML=j.donations.map(x=>`<div class=row><span><b>${esc(x.donorName)}</b><br><small class=muted>${esc(x.message||"Tanpa pesan")}</small></span><span style=text-align:right><b>${f(x.amount)}</b><br><span class=pill>${esc(x.status)}</span></span></div>`).join("")||'<div class=empty>Belum ada donasi.</div>';q.innerHTML=j.media.map(x=>`<div class=row><span><b>${esc(x.title||"Media Share")}</b><br><small class="muted media-url">${esc(x.url)}</small></span><span class=actions>${x.status==="PENDING_REVIEW"?`<button class="btn primary" onclick="approve('${x.id}')">Approve</button><button class="btn danger" onclick="rejectMedia('${x.id}')">Tolak</button>`:`<span class=pill>${esc(x.status)}</span>`}</span></div>`).join("")||'<div class=empty>Belum ada media.</div>'}async function approve(id){await fetch("/api/media/"+id+"/approve",{method:"POST",headers:H});load()}async function rejectMedia(id){await fetch("/api/media/"+id+"/reject",{method:"POST",headers:H});load()}function copyText(t){navigator.clipboard?.writeText(t);alert("URL berhasil disalin.")}function logout(){localStorage.removeItem("token");location="/"}load();setInterval(load,5000);
</script></body></html>
