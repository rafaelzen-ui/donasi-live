<!doctype html><html lang=id><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Dashboard</title><style>body{margin:0;background:#08090d;color:#fff;font-family:system-ui}.wrap{width:min(1100px,92%);margin:auto}.nav{height:70px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900}.brand b{color:#a78bfa}.btn{border:0;background:#8b5cf6;color:#fff;padding:10px 13px;border-radius:9px;cursor:pointer;text-decoration:none}.card{background:#12151c;border:1px solid #292d39;border-radius:17px;padding:20px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.num{display:block;font-size:28px;font-weight:900;margin-top:6px}.muted{color:#9ba1b0}.item{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #292d39}.overlay{background:#090b10;padding:12px;border-radius:9px;word-break:break-all}@media(max-width:700px){.stats{grid-template-columns:1fr}}</style></head><body><div class=wrap><nav class=nav><div class=brand>DONASI<b>.LIVE</b></div><button class=btn onclick="logout()">Logout</button></nav><div class=card id=profile></div><div class=stats><div class=card>Donasi<span class=num id=c>0</span></div><div class=card>Total<span class=num id=t>Rp0</span></div><div class=card>Media Queue<span class=num id=mq>0</span></div></div><div class=card><h2>YouTube</h2><div id=yt class=muted></div><br><a class=btn href=/api/integrations/youtube/start>Connect YouTube</a></div><div class=card><h2>OBS Browser Source</h2><p class=muted>Masukkan URL ini ke OBS → Sources → Browser:</p><div class=overlay id=ov></div></div><div class=card><h2>Donasi Terbaru</h2><div id=d></div></div><div class=card><h2>Media Share</h2><div id=q></div></div></div><script>const H={Authorization:"Bearer "+localStorage.token};if(!localStorage.token)location="/";const f=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);const esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));async function load(){const r=await fetch("/api/dashboard",{headers:H});if(!r.ok)return logout();const j=await r.json(),me=await(await fetch("/api/me",{headers:H})).json();profile.innerHTML=`<b>Halo, ${esc(me.user.displayName)}!</b><br><span class=muted>Halaman donasi: ${location.origin}/donate/${me.user.slug}</span>`;c.textContent=j.stats.count;t.textContent=f(j.stats.total);mq.textContent=j.stats.media;ov.textContent=location.origin+"/overlay/"+me.user.id;yt.innerHTML=me.user.youtube?`Terhubung: <b>${esc(me.user.youtube.channel?.title||"YouTube")}</b>`:"Belum terhubung";d.innerHTML=j.donations.map(x=>`<div class=item><span><b>${esc(x.donorName)}</b><br><small>${esc(x.message||"")}</small></span><b>${f(x.amount)}</b></div>`).join("")||"<span class=muted>Belum ada donasi.";q.innerHTML=j.media.map(x=>`<div class=item><span>${esc(x.title)}<br><small>${esc(x.url)}</small></span><span>${x.status} ${x.status==="PENDING_REVIEW"?`<button class=btn onclick="approve('${x.id}')">Approve</button>`:""}</span></div>`).join("")||"<span class=muted>Queue kosong."}async function approve(id){await fetch("/api/media/"+id+"/approve",{method:"POST",headers:H});load()}function logout(){localStorage.removeItem("token");location="/"}load();setInterval(load,5000)</script></body></html>
