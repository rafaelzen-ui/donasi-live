<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff}.alert{position:fixed;left:50%;bottom:8%;width:min(720px,90vw);transform:translate(-50%,40px) scale(.96);opacity:0;padding:22px 25px;text-align:center;border-radius:22px;background:linear-gradient(135deg,#15121fee,#0e0c15ee);border:1px solid #a78bfa88;box-shadow:0 20px 90px #000b;transition:.45s cubic-bezier(.2,.8,.2,1)}.alert.show{opacity:1;transform:translate(-50%,0) scale(1)}.tag{display:inline-flex;align-items:center;gap:7px;color:#c4b5fd;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 14px #22c55e}.name{font-size:30px;font-weight:950;margin-top:8px}.amt{font-size:21px;font-weight:900;background:linear-gradient(90deg,#c4b5fd,#f9a8d4);-webkit-background-clip:text;color:transparent;margin-top:3px}.msg{margin-top:8px;color:#dedee7;font-size:15px}.brand{margin-top:14px;color:#686878;font-size:10px;font-weight:800;letter-spacing:1px}
</style></head><body><div id="a" class="alert"><div class="tag"><span class="dot"></span> Donasi masuk</div><div id="n" class="name"></div><div id="v" class="amt"></div><div id="m" class="msg"></div><div class="brand">ZETDONATE</div></div><script>
const id=location.pathname.split("/").pop(),a=document.querySelector("#a");function show(x){n.textContent=x.donorName;v.textContent=new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(x.amount);m.textContent=x.message||"";a.classList.add("show");setTimeout(()=>a.classList.remove("show"),8000)}new EventSource("/api/overlay/"+id+"/events").addEventListener("donation_paid",e=>show(JSON.parse(e.data)));
</script></body></html>
