<!doctype html><html><head><meta charset=utf-8><style>html,body{margin:0;background:transparent;overflow:hidden;font-family:system-ui;color:#fff}.a{position:fixed;left:50%;bottom:8%;transform:translate(-50%,30px);opacity:0;min-width:330px;max-width:700px;padding:23px;text-align:center;border-radius:20px;background:#16101fee;border:1px solid #a78bfa;box-shadow:0 15px 70px #0008;transition:.4s}.a.show{opacity:1;transform:translate(-50%,0)}.name{font-size:26px;font-weight:900}.amt{color:#c4b5fd;font-size:20px;font-weight:800}.msg{margin-top:7px;color:#ddd}</style></head><body><div id=a class=a><div>❤️ DONASI MASUK</div><div id=n class=name></div><div id=v class=amt></div><div id=m class=msg></div></div><script>const id=location.pathname.split("/").pop(),a=document.querySelector("#a");function show(x){n.textContent=x.donorName;v.textContent=new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(x.amount);m.textContent=x.message||"";a.classList.add("show");setTimeout(()=>a.classList.remove("show"),8000)}new EventSource("/api/overlay/"+id+"/events").addEventListener("donation_paid",e=>show(JSON.parse(e.data)))</script></body></html>
